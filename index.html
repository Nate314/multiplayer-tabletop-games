<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- data-light and data-dark are the browser bar colors for each theme; ThemeToggle reads them too -->
    <meta name="theme-color" content="#2d6a4f" data-light="#2d6a4f" data-dark="#161616" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tabletop Games" />
    <title>Multiplayer Tabletop Games</title>
    <script>
      {
        // Storage can be blocked; the default theme is used then
        let theme = 'light';
        try {
          // Mirrors readText in src/services/storage.ts, which this script cannot import
          let saved = localStorage.getItem('multiplayer-tabletop-games:theme');
          if (saved === null && localStorage.getItem('multiplayer-tabletop-games:migrated') === null) {
            saved = localStorage.getItem('theme');
          }
          theme = saved || 'light';
        } catch {
          // keep the default
        }
        document.documentElement.setAttribute('data-theme', theme);
        const themeColor = document.querySelector('meta[name="theme-color"]');
        themeColor.content = themeColor.dataset[theme] || themeColor.dataset.light;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
